# ============================================
# DANIELECAMIZ.COM - SECURITY HEADERS
# File: /etc/nginx/sites-available/danielecamiz.com
# ============================================
#
# ISTRUZIONI:
# 1. Backup config attuale: sudo cp /etc/nginx/sites-available/danielecamiz.com /etc/nginx/sites-available/danielecamiz.com.backup
# 2. Aggiungi questi headers nel blocco server {} della configurazione esistente
# 3. Test config: sudo nginx -t
# 4. Reload: sudo systemctl reload nginx
#
# ============================================

# Security Headers (aggiungi dentro il blocco server {})
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content Security Policy
# NOTA: Personalizza i domini per script/style se usi CDN esterni
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://res.cloudinary.com; style-src 'self' 'unsafe-inline'; img-src 'self' https://res.cloudinary.com data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' https://res.cloudinary.com; object-src 'none'; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

# Permissions Policy (formerly Feature-Policy)
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# ============================================
# HTTPS REDIRECT (se non già presente)
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name danielecamiz.com www.danielecamiz.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# ============================================
# HTTPS SERVER BLOCK (esempio)
# ============================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name danielecamiz.com www.danielecamiz.com;

    # SSL Certificates (verifica i path corretti)
    ssl_certificate /etc/letsencrypt/live/danielecamiz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/danielecamiz.com/privkey.pem;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers (aggiungi qui tutti gli header sopra)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://res.cloudinary.com; style-src 'self' 'unsafe-inline'; img-src 'self' https://res.cloudinary.com data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' https://res.cloudinary.com; object-src 'none'; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Strict-Transport-Security (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Root e Index
    root /home/daniele/danielecamiz-site/frontend;
    index index.html;

    # Proxy pass al CMS Node.js (porta 3001 per staging)
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static files (se serviti direttamente da Nginx)
    location /css/ {
        alias /home/daniele/danielecamiz-site/frontend/css/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /js/ {
        alias /home/daniele/danielecamiz-site/frontend/js/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /img/ {
        alias /home/daniele/danielecamiz-site/frontend/img/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml+rss application/json image/svg+xml;
}
