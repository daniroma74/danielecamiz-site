# ================================
# orchestraicnt.danielecamiz.com
# Static SPA (public/) + proxy /api -> Node (4012)
# Cert: wildcard Cloudflare
# PROTECTED WITH HTTP BASIC AUTH
# ================================

# ---- HTTP (80) ----
server {
  listen 80;
  listen [::]:80;
  server_name orchestraicnt.danielecamiz.com;

  # Statici
  root /home/daniele/danielecamiz-site/orchestraicnt-site/public;
  index index.html;

  # Marker per debug: risposte statiche
  add_header X-Origin "nginx-static" always;

  # HTTP Basic Authentication
  auth_basic "Orchestra ICNT - Sito in Sviluppo";
  auth_basic_user_file /etc/nginx/.htpasswd_orchestra;

  # API → backend Node (PM2 @ 4012)
 # location /api/ {
  #  proxy_pass http://127.0.0.1:4012;
   # proxy_set_header Host $host;
    #proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #  proxy_set_header X-Forwarded-Proto $scheme;
  #  add_header X-Origin "node-api";
 # }

  # Evita cicli su favicon mancante
  location = /favicon.ico { try_files $uri =204; access_log off; log_not_found off; }

  # Fallback SPA (serve index.html per percorsi non trovati)
  location / { try_files $uri $uri/ /index.html; }
}

# ---- HTTPS (443) ----
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name orchestraicnt.danielecamiz.com;

  # Cert wildcard Cloudflare (come negli altri siti)
  ssl_certificate     /etc/ssl/cloudflare/wildcard.crt;
  ssl_certificate_key /etc/ssl/cloudflare/wildcard.key;

  # Statici
  root /home/daniele/danielecamiz-site/orchestraicnt-site/public;
  index index.html;

  # Marker per debug: risposte statiche
  add_header X-Origin "nginx-static" always;

  # HTTP Basic Authentication
  auth_basic "Orchestra ICNT - Sito in Sviluppo";
  auth_basic_user_file /etc/nginx/.htpasswd_orchestra;

  # API → backend Node (PM2 @ 4012)
  location /api/ {
    proxy_pass http://127.0.0.1:4012;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Origin "node-api";
  }

  # Evita cicli su favicon mancante
  location = /favicon.ico { try_files $uri =204; access_log off; log_not_found off; }

  # Fallback SPA
  location / { try_files $uri $uri/ /index.html; }
}
