<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coming Soon - Daniele Camiz</title>
  <link rel="stylesheet" href="css/base/base.css" />
  <style>
    /* Solo piccole personalizzazioni override per la pagina */
    body, html {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background-color: var(--bg-color);
      color: var(--accent-color);
      font-family: var(--font-family);
      flex-direction: column;
      padding: 1rem;
    }
    h1 {
      font-weight: 700;
      font-size: 3rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.3em;
    }
    p {
      font-size: 1.25rem;
      font-style: italic;
      color: var(--light-accent);
      max-width: 320px;
      margin: 0 auto 2rem auto;
    }
    .logo {
      font-weight: 700;
      font-size: 2rem;
      letter-spacing: 0.2em;
      margin-bottom: 2rem;
      user-select: none;
      color: var(--accent-color);
    }
    footer {
      position: fixed;
      bottom: 1rem;
      font-size: 0.9rem;
      color: var(--light-accent);
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="logo">Daniele Camiz</div>
  <h1>Coming Soon</h1>
  <p>Il sito è in costruzione.<br />Torna presto a trovarmi per tutte le novità!</p>
  <footer>© 2025 Daniele Camiz — Tutti i diritti riservati</footer>
</body>
</html>
